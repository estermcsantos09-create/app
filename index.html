<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meu Organizador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: menu lateral + painel (desktop); barra inferior no celular. Tema: janela ao pôr do sol, creme manteiga, dourado e post-its. */
:root{
  --bg:#FCF4DC; --surface:#FFFBEC; --surface2:#F7E9BC; --ink:#46341D; --muted:#7A6540; --line:#EAD9A0; --ctl:#B09858; --glow:rgba(255,196,72,.30);
  --accent:#92600B; --accent-ink:#FFFFFF; --accent-soft:#F6E3A0;
  --good:#4A7A2E; --good-soft:#E3EFC9; --warn:#8A5A0C; --warn-soft:#FBE7B0; --bad:#B02F28; --bad-soft:#F9DAD2;
  --t-pessoal:#B0476A; --t-estudo:#4B6BB0; --t-trabalho:#8A5A3C; --t-saude:#4A7A2E; --t-pagamento:#B08418;
  --note:#FBEB9E; --note-ink:#46341D; --note-muted:#7A6540;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'DM Sans','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Script','Bradley Hand',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1810; --surface:#2B2216; --surface2:#382D1C; --ink:#F8ECC9; --muted:#C4AE84; --line:#4A3C25; --ctl:#8E7A52; --glow:rgba(242,196,92,.12);
    --accent:#F2C45C; --accent-ink:#2A1D05; --accent-soft:#4B3A14;
    --good:#A8D07E; --good-soft:#2E3A1C; --warn:#F2C45C; --warn-soft:#4B3A14; --bad:#F29089; --bad-soft:#4A2421;
    --t-pessoal:#EE8FB0; --t-estudo:#8DA8E6; --t-trabalho:#D49A78; --t-saude:#A8D07E; --t-pagamento:#F2C45C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1810; --surface:#2B2216; --surface2:#382D1C; --ink:#F8ECC9; --muted:#C4AE84; --line:#4A3C25; --ctl:#8E7A52; --glow:rgba(242,196,92,.12);
  --accent:#F2C45C; --accent-ink:#2A1D05; --accent-soft:#4B3A14;
  --good:#A8D07E; --good-soft:#2E3A1C; --warn:#F2C45C; --warn-soft:#4B3A14; --bad:#F29089; --bad-soft:#4A2421;
  --t-pessoal:#EE8FB0; --t-estudo:#8DA8E6; --t-trabalho:#D49A78; --t-saude:#A8D07E; --t-pagamento:#F2C45C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(760px 380px at 0% 0%,var(--glow),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;min-height:100%}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.cap{text-transform:capitalize}
.hand{font-family:var(--f-hand);font-size:26px;line-height:1.1;color:var(--accent);margin:6px 0 0;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
button{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
main{min-width:0}
.nav{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;padding:6px 12px 14px;display:flex;align-items:center;gap:10px}
.mark{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--ink)}
.nav a[aria-current=page] svg{color:var(--accent)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:14px;border:1px solid var(--accent);border-radius:10px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--ctl)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--ctl)}
.btn.sm{padding:4px 10px;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.strip>div{background:var(--surface);padding:14px 16px;min-width:0}
.lbl{font-size:12px;color:var(--muted);display:block}
.strip b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;display:block;margin-top:2px;overflow-wrap:anywhere}
.strip small,.row small,.lnk small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.neg{color:var(--bad)} .pos{color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column}
.list>.row+.row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 4px;border:0;background:none;color:inherit;font-size:15px;text-align:left;border-radius:8px}
button.row{cursor:pointer}
.grow{flex:1;min-width:0}
.grow b,.lnk b{display:block;font-weight:600;overflow-wrap:anywhere}
.lnk{font-size:15px;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;flex:1}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ctl);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;padding:0;color:transparent}
.chk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chk[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);padding:8px 4px;font-size:14px}
.note{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.bar{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.bar b{font-variant-numeric:tabular-nums;font-weight:600}
.track{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal button{min-height:46px;border-radius:10px;border:1px solid transparent;background:var(--surface2);color:var(--ink);font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0}
.cal button.hoje{border-color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .blank{visibility:hidden}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.cal .sel .dots i{background:var(--accent-ink)!important}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{margin:0;text-transform:capitalize}
.hab{padding:12px 0;border-top:1px solid var(--line)}
.hab:first-of-type{border-top:0}
.hab-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hab-top button{font-weight:600;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.dayb{min-height:40px;border-radius:10px;border:1.5px solid var(--ctl);background:var(--surface);color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:2px 0}
.dayb b{font-size:13px;color:inherit;font-weight:700}
.dayb[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dayb.hoje{box-shadow:0 0 0 2px var(--accent-soft)}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kcol h2{font-family:var(--f-display);font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center}
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.task .lnk{flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.mini{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--ctl);background:var(--surface);color:var(--ink);cursor:pointer}
.foot{margin:22px 0 0;font-size:12px;color:var(--muted)}
.dia-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.themebtn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}
.themebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* post-its, frases e diário */
.sticky{margin:6px 0 0;position:relative;background:var(--note);color:var(--note-ink);padding:24px 18px 12px;border-radius:3px 3px 12px 3px;box-shadow:0 2px 3px rgba(70,52,29,.14),0 12px 22px rgba(70,52,29,.12);transform:rotate(-.7deg)}
.sticky::before,.stk::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F6DD94,#B98A2E);box-shadow:0 2px 3px rgba(70,52,29,.35)}
.sticky blockquote{margin:0;font-family:var(--f-hand);font-size:27px;line-height:1.15;font-weight:700}
.sticky figcaption{margin-top:10px;font-size:13px;color:var(--note-muted)}
.sticky-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.sticky .mini{background:rgba(255,255,255,.6);color:var(--note-ink);border-color:rgba(70,52,29,.35)}
.sticky .heart{color:#A33A56}
.heart{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.heart svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.heart[aria-pressed=true]{color:#B73F5F}
.heart[aria-pressed=true] svg{fill:currentColor}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(70,52,29,.15)}
.search{margin-bottom:12px;max-width:520px}
.search input,.field input,.field select,.field textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ctl);border-radius:10px;background:var(--surface);color:var(--ink)}
.field textarea{min-height:160px;resize:vertical;line-height:1.5}
h3.mes{font-family:var(--f-display);font-size:15px;text-transform:capitalize;color:var(--muted);margin:18px 0 8px;font-weight:500}
.entry{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;color:inherit;font-size:15px}
.edate{display:flex;flex-direction:column;align-items:center;min-width:38px}
.edate b{font-family:var(--f-display);font-size:24px;line-height:1}
.edate small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.etitle{font-weight:700;overflow-wrap:anywhere}
.etext{color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.egrat{font-family:var(--f-hand);font-size:20px;color:var(--accent);line-height:1.1}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:22px 18px;padding-top:10px}
.stk{position:relative;text-align:left;border:0;cursor:pointer;background:var(--note);color:var(--note-ink);padding:22px 16px 14px;border-radius:3px 3px 12px 3px;box-shadow:0 2px 3px rgba(70,52,29,.14),0 12px 22px rgba(70,52,29,.12);display:flex;flex-direction:column;gap:6px;min-height:150px;font-family:var(--f-hand)}
.stk:nth-child(odd){transform:rotate(-1deg)} .stk:nth-child(even){transform:rotate(.9deg)}
.stk .nt{font-size:27px;line-height:1.05;font-weight:700;overflow-wrap:anywhere}
.stk .nx{font-size:22px;line-height:1.15;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.stk .pintag{font-family:var(--f-body);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--note-muted)}
.c-rosa{--note:#F9D9DC} .c-verde{--note:#E1EDC4} .c-branco{--note:#FFFDF6}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qtext{font-family:var(--f-display);font-size:18px;line-height:1.3;text-wrap:balance}
.qwho{font-size:13px;color:var(--muted)}
.qacts{display:flex;align-items:center;gap:6px;margin-top:auto}
#modal{position:fixed;inset:0;z-index:50;background:rgba(40,28,10,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(520px,100%);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{background:var(--bg)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:18px;padding-bottom:20px}}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{display:block}
  main{padding-bottom:84px}
  .brand{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;gap:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;justify-content:center;min-width:0}
}
@media (prefers-reduced-motion:no-preference){.btn,.chk,.dayb,.mini,.entry,.stk{transition:background .15s,border-color .15s,transform .15s}.stk:hover{transform:rotate(0) translateY(-2px)}}
</style>

/* ---------- sincronização ---------- */
var REFS={}, timers={}, inflight={}, dirty={}, lastSaved={}, ready={}, firstWrite=false, status='conectando';
function footText(){
  if(status==='nuvem') return 'Salvo na sua conta, em uma área privada. Só você vê estes dados.';
  if(status==='lento') return 'A sua conta ainda não respondeu. O que você alterar fica neste navegador por enquanto.';
  if(status==='erro') return 'Não consegui salvar na sua conta agora. As alterações ficam neste navegador.';
  if(status==='local') return 'Salvo apenas neste navegador.';
  return 'Conectando à sua conta…';
}
function setStatus(s){status=s; var f=$('#foot'); if(f) f.textContent=footText();}
function queue(k){clearTimeout(timers[k]); timers[k]=setTimeout(function(){flush(k)},600);}
function persist(k){
  saveLocal();
  if(!REFS[k]) return;
  if(!firstWrite){firstWrite=true; KEYS.forEach(function(q){if(q!==k) queue(q)});}
  queue(k);
}
function persistAll(){KEYS.forEach(persist)}
async function flush(k){
  timers[k]=null;
  if(!REFS[k]) return;
  if(!ready[k]){timers[k]=setTimeout(function(){flush(k)},1000); return;}
  if(inflight[k]){dirty[k]=true; return;}
  inflight[k]=true;
  try{
    var json=JSON.stringify(S[k]); lastSaved[k]=json;
    await REFS[k].set({v:JSON.parse(json),t:Date.now()});
    if(status!=='nuvem') setStatus('nuvem');
  }catch(err){setStatus('erro');}
  finally{inflight[k]=false; if(dirty[k]){dirty[k]=false; flush(k);}}
}
async function connect(){
  var db=null,user=null;
  try{db=await claude.use('db'); user=await claude.use('user');}catch(e){}
  if(!db||!user){setStatus('local'); return;}
  var id=await user.id();
  if(!id){setStatus('local'); return;}
  var slow=setTimeout(function(){if(status==='conectando') setStatus('lento')},10000);
  KEYS.forEach(function(k){
    var ref=db.doc('data/users/'+id+'/'+k); REFS[k]=ref;
    ref.onSnapshot(function(snap){
      if(snap.metadata.hasPendingWrites) return;
      var changed=false;
      if(snap.exists){
        var v=(snap.data()||{}).v;
        if(v&&(!ready[k]||!(timers[k]||inflight[k]))){
          var j=JSON.stringify(v);
          if(j!==lastSaved[k]){S[k]=clone(v); lastSaved[k]=j; changed=true;}
        }
      }
      if(!snap.metadata.fromCache){
        ready[k]=true;
        if(KEYS.every(function(q){return ready[q]})){clearTimeout(slow); if(status!=='erro') setStatus('nuvem');}
      }
      if(changed){ensure(); saveLocal(); render();}
    },function(){setStatus('erro')});
  });
}

function prazoBadge(s,done){
  if(!s) return '';
  var n=diasAte(s), cls='', txt;
  if(done) txt=fmtD(s);
  else if(n<0){cls='bad'; txt='atrasado '+(-n)+(-n===1?' dia':' dias');}
  else if(n===0){cls='warn'; txt='hoje';}
  else if(n===1){cls='warn'; txt='amanhã';}
  else txt=fmtD(s)+' · em '+n+' dias';
  return '<span class="chip '+cls+'">'+txt+'</span>';
}

function vTrab(){
  var m=today().slice(0,7), T=S.trabalho.tarefas;
  var abertas=T.filter(function(x){return x.status!=='done'}).length;
  var aRec=T.filter(function(x){return x.valor>0&&!x.recebido}).reduce(function(s,x){return s+(+x.valor||0)},0);
  var recMes=T.filter(function(x){return x.recebido&&(x.recebidoEm||'').indexOf(m)===0}).reduce(function(s,x){return s+(+x.valor||0)},0);
  function card(x){
    var acts='';
    if(x.status==='todo') acts+='<button class="mini" data-act="mover" data-dir="1" data-id="'+x.id+'">Iniciar →</button>';
    if(x.status==='doing') acts+='<button class="mini" data-act="mover" data-dir="-1" data-id="'+x.id+'">← A fazer</button><button class="mini" data-act="mover" data-dir="1" data-id="'+x.id+'">Concluir →</button>';
    if(x.status==='done'){
      acts+='<button class="mini" data-act="mover" data-dir="-1" data-id="'+x.id+'">← Reabrir</button>';
      if(x.valor>0) acts+='<button class="mini" data-act="tog-rec" data-id="'+x.id+'">'+(x.recebido?'Desfazer recebido':'Marcar recebido')+'</button>';
    }
    return '<article class="task"><button class="lnk" data-act="edit" data-kind="tarefa" data-id="'+x.id+'"><b>'+esc(x.titulo)+'</b>'+(x.cliente?'<small>'+esc(x.cliente)+'</small>':'')+'</button><div class="meta">'+prazoBadge(x.prazo,x.status==='done')+(x.valor>0?'<span class="chip">'+money(x.valor)+'</span>':'')+(x.recebido?'<span class="chip good">recebido</span>':'')+'</div><div class="acts">'+acts+'</div></article>';
  }
  var cols=STATUS.map(function(s){
    var l=T.filter(function(x){return x.status===s[0]}).sort(byPrazo);
    return '<section class="kcol"><h2>'+s[1]+'<span class="chip">'+l.length+'</span></h2>'+(l.length?l.map(card).join(''):'<p class="empty">Vazio</p>')+'</section>';
  }).join('');
  return '<header class="page-head"><div><p class="eyebrow">Trabalho</p><h1>Projetos e clientes</h1></div><div class="head-actions"><button class="btn" data-act="new" data-kind="tarefa">+ Tarefa</button></div></header>'+exNote()+
  '<div class="strip"><div><span class="lbl">Em aberto</span><b>'+abertas+'</b></div><div><span class="lbl">A receber</span><b>'+money(aRec)+'</b></div><div><span class="lbl">Recebido neste mês</span><b class="pos">'+money(recMes)+'</b></div></div>'+
  '<div class="kan">'+cols+'</div>';
}

  if(!l.length) return '<p class="empty">'+(q?'Nada encontrado para essa busca.':'Seu diário está vazio. Use “+ Escrever” para registrar o primeiro dia.')+'</p>';
  var out='', ult='';

function fieldHtml(f,vals,req){

  }else if(type==='textarea'){
    ctl='<textarea id="'+id+'" name="'+k+'" rows="8"'+(needed?' required':'')+'>\n'+esc(val==null?'':val)+'</textarea>';
  }else{
    var extra=type==='number'?(k==='dia'?'min="1" max="31" step="1" inputmode="numeric"':'min="0" step="any" inputmode="decimal"'):'';
    ctl='<input id="'+id+'" name="'+k+'" type="'+type+'" '+extra+' value="'+esc(val==null?'':val)+'"'+(needed?' required':'')+'>';
  }
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+ctl+'</div>';
}

  var first=m.querySelector(kind==='diario'||kind==='nota'?'textarea':'input,select'); if(first){try{first.focus({preventScroll:true})}catch(e){}}
}
function closeForm(){ui.form=null; var m=$('#modal'); m.hidden=true; m.innerHTML='';}
function submitForm(form){
  var f=ui.form; if(!f) return;
  var cfg=FORMS[f.kind], fd=new FormData(form), vals={};
  cfg.f.forEach(function(x){
    var v=fd.get(x[0]);
    if(x[2]==='number') vals[x[0]]=v===''||v==null?0:Number(v);
    else vals[x[0]]=String(v==null?'':v).trim();
  });
  if(f.kind==='reserva'){Object.assign(S.fin.reserva,vals); delete S.fin.reserva.ex;}
  else if(f.id){
    var it=COLL[f.kind]().find(function(x){return x.id===f.id});
    if(it){
      Object.assign(it,vals); delete it.ex;
      if(f.kind==='tarefa'){
        if(it.status!=='done'&&it.recebido) setRecebido(it,false);
        else if(it.recebido) setRecebido(it,true);
      }
    }
  }else{
    var novo=Object.assign({id:uid8()},vals);
    if(f.kind==='conta') novo.pagos=[];
    if(f.kind==='habito') novo.feitos={};
    if(f.kind==='diario'||f.kind==='nota') novo.criada=Date.now();
    COLL[f.kind]().push(novo);
  }
  persist(MOD[f.kind]); closeForm(); render();
}
function delItem(){
  var f=ui.form; if(!f||!f.id) return;
  var arr=COLL[f.kind](), i=arr.findIndex(function(x){return x.id===f.id});
  if(i>=0) arr.splice(i,1);
  persist(MOD[f.kind]); closeForm(); render();
}

/* ---------- ações ---------- */
function setRecebido(t,on){
  S.fin.tx=S.fin.tx.filter(function(x){return x.ref!=='t:'+t.id});
  if(on){
    t.recebido=true; if(!t.recebidoEm) t.recebidoEm=today();
    S.fin.tx.push({id:uid8(),date:t.recebidoEm,desc:'Recebido: '+t.titulo,valor:t.valor,tipo:'in',cat:'Trabalho',ref:'t:'+t.id});
  }else{t.recebido=false; delete t.recebidoEm;}
  persist('fin'); persist('trabalho');
}
function togConta(c,m){
  var ref='c:'+c.id+':'+m;
  S.fin.tx=S.fin.tx.filter(function(x){return x.ref!==ref});
  var i=c.pagos.indexOf(m);
  if(i>=0) c.pagos.splice(i,1);
  else{
    c.pagos.push(m);
    var date=m===today().slice(0,7)?today():m+'-'+pad(Math.min(c.dia||1,28));
    S.fin.tx.push({id:uid8(),date:date,desc:'Pago: '+c.nome,valor:c.valor,tipo:'out',cat:'Contas',ref:ref});
  }
  persist('fin');
}
function limparEx(){
  S.fin.tx=S.fin.tx.filter(function(x){return !x.ex});
  S.fin.contas=S.fin.contas.filter(function(x){return !x.ex});
  S.agenda.eventos=S.agenda.eventos.filter(function(x){return !x.ex});
  S.rotina.habitos=S.rotina.habitos.filter(function(x){return !x.ex});
  S.rotina.blocos=S.rotina.blocos.filter(function(x){return !x.ex});
  S.trabalho.tarefas=S.trabalho.tarefas.filter(function(x){return !x.ex});
  S.diario.entradas=S.diario.entradas.filter(function(x){return !x.ex});
  S.notas.itens=S.notas.itens.filter(function(x){return !x.ex});
  if(S.fin.reserva.ex) S.fin.reserva={nome:'Reserva de emergência',alvo:0,guardado:0};
  persistAll(); render();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.dataset.act, id=el.dataset.id, kind=el.dataset.kind;
  if(a==='close'&&el.id==='modal'&&e.target!==el) return;
  var t=today();
  if(a==='new') openForm(kind,null);
  else if(a==='edit') openForm(kind,id);
  else if(a==='reserva') openForm('reserva',null);
  else if(a==='close') closeForm();
  else if(a==='del') delItem();
  else if(a==='mes'){ui.mes=shiftMes(ui.mes,+el.dataset.d); render();}
  else if(a==='calmes'){ui.calMes=shiftMes(ui.calMes,+el.dataset.d); render();}
  else if(a==='dia'){ui.dia=id; render();}
  else if(a==='hoje-cal'){ui.calMes=t.slice(0,7); ui.dia=t; render();}
  else if(a==='limpar-ex') limparEx();
  else if(a==='dsub'){ui.dsub=id; render();}
  else if(a==='sofav'){ui.soFav=!ui.soFav; render();}
  else if(a==='outra'){ui.qOff++; render();}
  else if(a==='fav'){
    var fv=S.diario.favs, fi=fv.indexOf(id);
    if(fi>=0) fv.splice(fi,1); else fv.push(id);
    persist('diario'); render();
  }
  else if(a==='anotar-frase'){
    var q=quoteById(id);
    if(q) openForm('diario',null,{texto:'“'+q.t+'” — '+q.a+'\n\n'});
  }
  else if(a==='tog-bloco'){
    var l=S.rotina.feitos[t]||[], i=l.indexOf(id);
    if(i>=0) l.splice(i,1); else l.push(id);
    S.rotina.feitos[t]=l; persist('rotina'); render();
  }
  else if(a==='tog-hab'){
    var h=S.rotina.habitos.find(function(x){return x.id===id}), d=el.dataset.date;
    if(h){if(h.feitos[d]) delete h.feitos[d]; else h.feitos[d]=1; persist('rotina'); render();}
  }
  else if(a==='tog-conta'){
    var c=S.fin.contas.find(function(x){return x.id===id});
    if(c){togConta(c,el.dataset.mes); render();}
  }
  else if(a==='mover'){
    var tk=S.trabalho.tarefas.find(function(x){return x.id===id}), ord=['todo','doing','done'];
    if(tk){
      var n=ord.indexOf(tk.status)+(+el.dataset.dir);
      if(ord[n]){
        if(tk.status==='done'&&tk.recebido) setRecebido(tk,false);
        tk.status=ord[n]; persist('trabalho'); render();
      }
    }
  }
  else if(a==='tog-rec'){
    var tr=S.trabalho.tarefas.find(function(x){return x.id===id});
    if(tr){setRecebido(tr,!tr.recebido); render();}
  }
});
document.addEventListener('submit',function(e){
  if(e.target&&e.target.id==='frm'){e.preventDefault(); submitForm(e.target);}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){ui.q=e.target.value; var l=$('#dlist'); if(l) l.innerHTML=dlistHtml();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.form) closeForm();});
window.addEventListener('hashchange',route);

/* ---------- tema: automático, claro ou escuro ---------- */
var TK='meu-organizador:tema', TEMAS=['auto','claro','escuro'];
var TNOME={auto:'Automático',claro:'Claro',escuro:'Escuro'};
var TICON={
  claro:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>',
  escuro:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" style="fill:currentColor"/></svg>'
};
function temaSalvo(){try{var v=localStorage.getItem(TK); if(TEMAS.indexOf(v)>=0) return v;}catch(e){} return 'auto';}
function aplicaTema(v){
  var r=document.documentElement;
  if(v==='claro') r.setAttribute('data-theme','light');
  else if(v==='escuro') r.setAttribute('data-theme','dark');
  else r.removeAttribute('data-theme');
  var b=$('#theme');
  if(b){
    b.innerHTML=TICON[v]+'<span>Tema: '+TNOME[v]+'</span>';
    b.setAttribute('aria-label','Tema: '+TNOME[v]+'. Toque para trocar.');
  }
}
$('#theme').addEventListener('click',function(){
  var prox=TEMAS[(TEMAS.indexOf(temaSalvo())+1)%TEMAS.length];
  try{localStorage.setItem(TK,prox)}catch(e){}
  aplicaTema(prox);
});
aplicaTema(temaSalvo());

route();
connect();
})();
</script>
